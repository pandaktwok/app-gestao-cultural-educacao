# Stack de produção/homologação usando SQLite (mesmo banco do schema.prisma).
# Antes de subir, crie um arquivo .env na raiz com:
#   JWT_SECRET=<string aleatória com 32+ caracteres>   (ex.: openssl rand -hex 32)
#   INITIAL_ADMIN_PASSWORD=<senha inicial do administrador>
#   NEXT_PUBLIC_API_URL=https://seu-dominio/api        (opcional)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cultural_app_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (32+ caracteres)}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      GOOGLE_DRIVE_CREDENTIALS_PATH: /app/config/credentials.json
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${GOOGLE_DRIVE_PARENT_FOLDER_ID:-}
    volumes:
      - ./backend/config:/app/config
      - ./backend/uploads:/app/uploads
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: cultural_app_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlite_data:
